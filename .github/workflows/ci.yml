name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Unit and integration tests
        run: pytest -q
      - name: Validate scenario suite
        run: supportsim validate

  eval-gate:
    # Replays recorded real-model conversations through the current code and fails the
    # build if the agent loop, tools, guardrail or grader change the outcome.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Replay recorded conversations and run the regression gate
        run: make replay

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t support-agent-simulator .
      - name: Smoke test
        run: |
          docker run -d -p 8000:8000 --name app support-agent-simulator
          for i in $(seq 1 20); do curl -fs localhost:8000/healthz && exit 0; sleep 1; done
          docker logs app; exit 1
