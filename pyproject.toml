[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "support-agent-simulator"
version = "0.1.0"
description = "Tool-calling customer-support agent evaluated against LLM-simulated customers: outcome-based grading, pass^k reliability, runtime policy guardrails, tracing."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Juhi Dixit" }]
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "jinja2>=3.1"]

[project.optional-dependencies]
local = ["llama-cpp-python>=0.3.8"]
anthropic = ["anthropic>=0.60"]
server = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8", "ruff>=0.6", "fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
supportsim = "supportsim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"supportsim.data" = ["*.json", "*.md"]
"supportsim.server" = ["static/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
